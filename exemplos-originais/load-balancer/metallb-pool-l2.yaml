# Referência de ADMINISTRADOR: pool de IPs e anúncio em camada 2 do MetalLB.
# Não aplique no ambiente do curso: o lab start já configura o MetalLB.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: pool-servicos
  namespace: metallb-system
spec:
  addresses:
    - 192.168.77.20-192.168.77.29
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: anuncio-servicos
  namespace: metallb-system
spec:
  ipAddressPools:
    - pool-servicos
