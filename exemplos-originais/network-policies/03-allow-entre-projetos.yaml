# api aceita Pods app=relatorio DE namespaces rotulados zona=interna (mesmo item = E).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-aceita-relatorios
  namespace: loja
spec:
  podSelector:
    matchLabels:
      app: api
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              zona: interna
          podSelector:
            matchLabels:
              app: relatorio
      ports:
        - port: 8080
          protocol: TCP
