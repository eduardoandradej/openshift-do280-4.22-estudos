# Strategic merge patch para: oc patch deployment catalogo --patch-file patch-limites.yaml
# Containers são mesclados pela chave "name": o nome precisa existir no Deployment.
spec:
  template:
    spec:
      containers:
        - name: httpd
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
