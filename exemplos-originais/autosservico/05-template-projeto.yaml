# Template de projeto (lição 6.5). Ponto de partida: saída de
#   oc adm create-bootstrap-project-template -o yaml
# acrescida de LimitRange, ResourceQuota e NetworkPolicy.
# Publicar:  oc apply -f 05-template-projeto.yaml -n openshift-config
# Ativar:    06-projects-config.yaml (afeta o cluster inteiro)
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: project-request
objects:
- apiVersion: project.openshift.io/v1
  kind: Project
  metadata:
    name: ${PROJECT_NAME}
    annotations:
      openshift.io/description: ${PROJECT_DESCRIPTION}
      openshift.io/display-name: ${PROJECT_DISPLAYNAME}
      openshift.io/requester: ${PROJECT_REQUESTING_USER}
  spec: {}
- apiVersion: rbac.authorization.k8s.io/v1
  kind: RoleBinding
  metadata:
    name: admin
    namespace: ${PROJECT_NAME}
  roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: admin
  subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: ${PROJECT_ADMIN_USER}
- apiVersion: v1
  kind: LimitRange
  metadata:
    name: padroes
    namespace: ${PROJECT_NAME}
  spec:
    limits:
    - type: Container
      default:
        memory: 512Mi
      defaultRequest:
        memory: 256Mi
      max:
        memory: 1Gi
      min:
        memory: 64Mi
- apiVersion: v1
  kind: ResourceQuota
  metadata:
    name: memoria
    namespace: ${PROJECT_NAME}
  spec:
    hard:
      requests.memory: 4Gi
      limits.memory: 8Gi
      count/pods: "20"
- apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: permitir-mesmo-namespace
    namespace: ${PROJECT_NAME}
  spec:
    podSelector: {}
    ingress:
    - from:
      - podSelector: {}
parameters:
- name: PROJECT_NAME
- name: PROJECT_DISPLAYNAME
- name: PROJECT_DESCRIPTION
- name: PROJECT_ADMIN_USER
- name: PROJECT_REQUESTING_USER
