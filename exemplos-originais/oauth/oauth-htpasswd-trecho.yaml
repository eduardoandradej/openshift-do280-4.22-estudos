# Trecho do recurso OAuth "cluster" com um IdP HTPasswd (exemplo autoral).
# NÃO aplique este arquivo como está: ele substituiria a lista inteira de IdPs.
# Use-o como referência ao editar o objeto exportado com: oc get oauth cluster -o yaml
apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:
    # ... mantenha aqui os provedores já existentes (ex.: LDAP) ...
    - name: usuarios-locais        # prefixo das Identities: usuarios-locais:<usuario>
      mappingMethod: claim
      type: HTPasswd
      htpasswd:
        fileData:
          name: htpasswd-usuarios  # Secret em openshift-config com a chave "htpasswd"
